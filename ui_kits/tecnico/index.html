<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script src="../../config.js"></script>
<script src="../../auth.js"></script>
<script src="../../api-client.js"></script>
<script>
  // Guarda de rota: o painel é a área logada — sem sessão (Cognito ou demo), volta ao login.
  // A promise fica disponível para o App montar a navegação do perfil (admin | rh | colaborador).
  window.MORAH_USER_PROMISE = (async function () {
    try {
      const u = await window.MorahAuth.requireAuth();
      if (u) window.MORAH_USER = u;
      return u;
    } catch (e) {
      // FAIL-CLOSED (auditoria A3): se a sessão não pôde sequer ser verificada — SDK do
      // Cognito bloqueada, CDN fora do ar, MITM —, o painel NÃO pode renderizar. Antes
      // o catch "mantinha a página" e o App assumia perfil 'rh', ou seja, bastava
      // bloquear um script para a área logada aparecer sem sessão. Volta ao login.
      try {
        var cfg = window.MORAH_AUTH_CONFIG;
        if (cfg && cfg.loginUrl) window.location.replace(cfg.loginUrl);
      } catch (e2) { /* sem como redirecionar: ao menos não devolve usuário */ }
      return null;
    }
  })();
</script>
<script src="../../_ds_bundle.js"></script>

  html, body { margin: 0; height: 100%; background: var(--bg-app); }

</script>
